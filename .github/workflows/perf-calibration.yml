# Experiment E1, defined in ADR 0007 (performance floor).
#
# This workflow measures the *runner*, not this project's code. The workload is
# deliberately not the emulator, which does not exist yet. Its purpose is to answer
# whether the ubuntu-24.04 runner class is stable enough to carry a performance gate,
# and to produce the run count and tolerance band ADR 0007 leaves PROVISIONAL.
#
# It gates nothing. There is no performance job in ci.yml, because ADR 0007 forbids a
# job that reports a pass while measuring nothing, and there is nothing to measure until
# the emulator exists.
#
# ADR 0007 asks for samples "deliberately spread across different times of day", so this
# runs on a schedule rather than on push. Each run downloads the accumulated samples,
# adds its own, re-analyses the whole set, and writes the report to the job summary.
# The experiment therefore reports its own progress and needs no manual collection.

name: Performance calibration (E1)

on:
  schedule:
    # Every three hours: eight samples a day, which is the analyser's minimum job count.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    name: calibration sample
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build the calibration workload (release)
        run: |
          cmake --preset linux-gcc-release
          cmake --build --preset linux-gcc-release --target gb_calibration

      - name: Recover the accumulated samples
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p perf-results

          # Each run uploads the cumulative set, so the newest artefact is the one to
          # recover. The API's ordering is not documented as guaranteed, and picking the
          # wrong one would silently discard samples and let the analysis proceed on a
          # subset - a quiet data loss rather than a failure. So the newest is selected
          # explicitly, by created_at.
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=calibration-samples&per_page=100" \
            > artifacts.json
          url=$(python3 -c "
          import json
          artifacts = [a for a in json.load(open('artifacts.json'))['artifacts'] if not a['expired']]
          artifacts.sort(key=lambda a: a['created_at'], reverse=True)
          print(artifacts[0]['archive_download_url'] if artifacts else '')
          ")

          if [ -z "$url" ]; then
            echo "no previous samples; this is the first"
            echo "RECOVERED=0" >> "$GITHUB_ENV"
            exit 0
          fi

          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -o previous.zip "$url"
          unzip -q -o previous.zip -d perf-results
          recovered=$(find perf-results -name 'calibration-*.json' | wc -l)
          echo "recovered $recovered previous sample(s)"

          # An artefact that existed but yielded nothing means the dataset just reset
          # itself. Continuing would produce an analysis of one sample that looks like a
          # legitimate result.
          if [ "$recovered" -eq 0 ]; then
            echo "::error::an artefact was found but no samples were recovered from it"
            exit 1
          fi
          echo "RECOVERED=$recovered" >> "$GITHUB_ENV"

      - name: Take this job's sample
        run: |
          python3 scripts/run_calibration.py \
            --binary build/linux-gcc-release/tools/calibration/gb_calibration \
            --runs 7 \
            --out perf-results

      - name: Analyse everything collected so far
        run: |
          total=$(find perf-results -name 'calibration-*.json' | wc -l)
          echo "dataset: ${RECOVERED:-0} recovered + 1 from this job = $total sample(s)"
          python3 scripts/analyze_calibration.py perf-results | tee report.txt
          {
            echo '## Experiment E1 — calibration'
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the accumulated samples
        uses: actions/upload-artifact@v4
        with:
          name: calibration-samples
          path: perf-results/
          retention-days: 90
