# Continuous integration.
#
# This workflow is the mechanism behind most of ADR 0001 (toolchain). Its job is not to
# prove the code works - the tests do that - but to prove the guards fire on a machine
# nobody has configured by hand:
#
#   * the build matrix is A2's claim that clang and GCC are both enforcing compilers,
#     and B3's claim that satisfying one is not evidence about the other;
#   * the sanitizer legs are B10 and B11;
#   * ctest carries B12's purity self-test, which is B14's demonstration that the guard
#     rejects a planted violation;
#   * the guards job plants violations deliberately and passes only when the build
#     fails, which is the same demonstration for the checks ctest cannot reach.
#
# There is deliberately no performance job. ADR 0007 (performance floor) requires that a
# job which measures nothing must not report a pass, and there is nothing to measure yet.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both compilers report independently. A failure on one leg must not hide the
      # other's result, because the whole point of the matrix is that they disagree.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-gcc-debug
            tests: true
          - os: ubuntu-24.04
            preset: linux-gcc-release
            tests: false
          - os: windows-2022
            preset: windows-clang-debug
            tests: true
          - os: windows-2022
            preset: windows-clang-release
            tests: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Ensure clang is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang++ -ErrorAction Ignore)) {
            $llvm = "C:\Program Files\LLVM\bin"
            if (Test-Path $llvm) {
              Add-Content -Path $env:GITHUB_PATH -Value $llvm
              Write-Host "Added $llvm to PATH"
            } else {
              throw "clang++ not found and $llvm does not exist"
            }
          }

      - name: Record toolchain
        run: |
          cmake --version
          ninja --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.tests
        run: ctest --preset ${{ matrix.preset }}

  guards:
    name: guards reject planted violations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset linux-gcc-debug

      - name: Baseline build must succeed
        run: cmake --build --preset linux-gcc-debug

      # Each plant below must fail the build. A plant that builds is a broken guard, and
      # this job reports it as such rather than passing quietly. The file is restored
      # after every plant so the next one starts from a known state.
      - name: Forbidden header in the core (ADR 0001 B13)
        run: |
          printf '#include <cstdio>\n' | cat - core/placeholder.cpp > /tmp/p && mv /tmp/p core/placeholder.cpp
          if cmake --build --preset linux-gcc-debug > /tmp/out 2>&1; then
            echo "::error::planted <cstdio> did not fail the build"; cat /tmp/out
            git checkout -- core/placeholder.cpp; exit 1
          fi
          grep -q "forbidden header <cstdio>" /tmp/out || {
            echo "::error::build failed for the wrong reason"; cat /tmp/out
            git checkout -- core/placeholder.cpp; exit 1; }
          echo "rejected as designed"
          git checkout -- core/placeholder.cpp

      - name: Cross-target include in the core (ADR 0008 rule 1)
        run: |
          printf '#include "tools/main.hpp"\n' | cat - core/placeholder.cpp > /tmp/p && mv /tmp/p core/placeholder.cpp
          if cmake --build --preset linux-gcc-debug > /tmp/out 2>&1; then
            echo "::error::planted cross-target include did not fail the build"; cat /tmp/out
            git checkout -- core/placeholder.cpp; exit 1
          fi
          grep -q "dependency runs one way" /tmp/out || {
            echo "::error::build failed for the wrong reason"; cat /tmp/out
            git checkout -- core/placeholder.cpp; exit 1; }
          echo "rejected as designed"
          git checkout -- core/placeholder.cpp

      - name: Narrowing conversion (ADR 0001 B5, the pattern only GCC catches)
        run: |
          cat >> core/placeholder.cpp <<'PLANT'

          unsigned char planted_adc(unsigned char a, unsigned char b, unsigned char carry) {
              unsigned char r = a + b + carry;
              return r;
          }
          PLANT
          if cmake --build --preset linux-gcc-debug > /tmp/out 2>&1; then
            echo "::error::planted narrowing conversion did not fail the build"; cat /tmp/out
            git checkout -- core/placeholder.cpp; exit 1
          fi
          grep -q "Werror=conversion" /tmp/out || {
            echo "::error::build failed for the wrong reason"; cat /tmp/out
            git checkout -- core/placeholder.cpp; exit 1; }
          echo "rejected as designed"
          git checkout -- core/placeholder.cpp

      - name: Working tree restored
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::plants left residue"; exit 1; }

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting (ADR 0001 B15)
        run: |
          clang-format --version
          find core tools frontend tests \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and clang-tidy
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy

      - name: Configure (for compile_commands.json)
        run: cmake --preset linux-gcc-debug

      - name: Run clang-tidy (ADR 0001 B16)
        run: |
          clang-tidy --version
          files=$(git ls-files 'core/*.cpp' 'tools/*.cpp' 'frontend/*.cpp')
          echo "checking: $files"
          clang-tidy -p build/linux-gcc-debug $files
